name: Lighthouse

permissions:
  contents: read

# SECURITY: run on demand only. The previous `on: [push]` trigger ran this
# job - which publishes the built theme via bin/theme-upload.js (deleting
# every non-live theme on the target account) and receives the Zendesk API
# token and end-user credentials - on EVERY push to EVERY branch, exposing
# the secrets to any-branch workflow runs and making a stray feature-branch
# push a production deploy. Deploys are owned by update.yml (main/sandbox
# only); this audit job is maintainer-dispatched.
#
# Residual risk (cannot be fully closed inside this file): a dispatch of a
# modified copy of this workflow on a writer's feature branch still executes
# that branch's file with repository-level secrets. The `if` guard below
# stops dispatches of THIS file from non-main/sandbox refs, and the job is
# bound to the `lighthouse` environment so the credentials can be moved to
# environment secrets with deployment-branch rules + required reviewers
# (Settings -> Environments), which is the complete fix. Alternatively,
# delete this workflow if the audit is unused in this fork.
"on": [workflow_dispatch]

jobs:
  lighthouse:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sandbox'
    environment: lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: zendesk/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup Node.js
        uses: zendesk/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: '.nvmrc'
      # The following step is needed to run puppeteer with ubuntu >= 23.10
      # ref: https://pptr.dev/troubleshooting#issues-with-apparmor-on-ubuntu
      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install node_modules
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Upload theme
        run: node ./bin/theme-upload.js
        env:
          ZENDESK_EMAIL: ${{ secrets.zendesk_email }}
          ZENDESK_API_TOKEN: ${{ secrets.zendesk_token }}
          ZENDESK_SUBDOMAIN: ${{ secrets.subdomain }}
          BRAND_ID: ${{ secrets.brand_id }}
      - name: Audit URLs using Lighthouse
        run: yarn test-a11y
        env:
          end_user_email: ${{ secrets.end_user_email }}
          end_user_password: ${{ secrets.end_user_password }}
          subdomain: ${{ secrets.subdomain }}
          urls: |
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/categories/360002267479
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/sections/360003307259
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/articles/360010829359
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/search?utf8=%E2%9C%93&query=Help+Center
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/community/topics
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/community/topics/360000644279
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/community/posts
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/community/posts/360006766799
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/profiles/364655812519
            https://${{ secrets.subdomain }}.zendesk.com/hc/contributions/posts?locale=en-us
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/subscriptions
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/requests
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/requests/3
            https://${{ secrets.subdomain }}.zendesk.com/hc/en-us/community/posts/new
