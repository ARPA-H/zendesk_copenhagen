name: CODEOWNERS validity

# CODEOWNERS fails OPEN when entries are invalid: GitHub silently ignores
# unknown owners, and a file with no valid owners vacuously satisfies a
# "require code owner review" rule. This check calls the codeowners/errors
# API for the ref under test and fails on ANY error, so the review gate can
# never be silently disabled by a typo, a renamed team, or a departed
# account. Require this check in the `main` Ruleset.
#
# Scope: this is an ACCIDENT guard, not an authorization boundary. GitHub
# determines code owners from the CODEOWNERS on the PR's BASE branch, so a
# PR shipping a broken CODEOWNERS cannot weaken its own review requirement -
# breakage only bites AFTER merge, and the push trigger below re-validates
# main/sandbox from the trusted branch definition the moment that happens.
# A forged same-name Actions check could only mask the advisory PR-time
# signal, never bypass the native code-owner review itself.

permissions:
  contents: read

on:
  # pull_request_target, NOT pull_request: this executes the workflow
  # definition from the PR's BASE branch (a protected branch here), so a PR
  # cannot edit this file to skip the check or force success. Safe because
  # the job performs no checkout and only makes one read-only API call
  # against the PR's head SHA (a server-provided value, never interpolated).
  # `edited` covers base-branch retargeting so a commit-scoped success from
  # an earlier base cannot go stale unnoticed after a retarget round-trip.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main
      - sandbox
  push:
    branches:
      - main
      - sandbox

jobs:
  codeowners-errors:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any CODEOWNERS error
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // On PR events validate BOTH refs: the base branch holds the
            // CODEOWNERS GitHub actually enforces for this PR's review
            // requirement (its live state, hence the branch name), and the
            // head holds what this PR would make the enforced file for
            // every subsequent PR. On push events, the pushed commit.
            const refs = context.payload.pull_request
              ? [
                  context.payload.pull_request.base.ref,
                  context.payload.pull_request.head.sha,
                ]
              : [context.sha];

            let totalErrors = 0;
            for (const ref of refs) {
              // Raw endpoint call: immune to Octokit generated-method naming.
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/codeowners/errors",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: ref,
                }
              );
              for (const error of data.errors || []) {
                totalErrors += 1;
                core.error(
                  `[${ref}] ${error.path}:${error.line} ${error.kind}: ${error.message}`
                );
              }
            }
            if (totalErrors > 0) {
              core.setFailed(
                `${totalErrors} CODEOWNERS error(s) - invalid entries fail OPEN, fix them before merging.`
              );
            } else {
              core.info("CODEOWNERS is valid on all checked refs.");
            }
