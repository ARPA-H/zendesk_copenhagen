name: CODEOWNERS validity

# CODEOWNERS fails OPEN when entries are invalid: GitHub silently ignores
# unknown owners, and a file with no valid owners vacuously satisfies a
# "require code owner review" rule. This check calls the codeowners/errors
# API for the ref under test and fails on ANY error, so the review gate can
# never be silently disabled by a typo, a renamed team, or a departed
# account. Require this check in the `main` Ruleset.
#
# Scope: this is an ACCIDENT guard, not an authorization boundary. GitHub
# determines code owners from the CODEOWNERS on the PR's BASE branch, so a
# PR shipping a broken CODEOWNERS cannot weaken its own review requirement -
# breakage only bites AFTER merge, and the push trigger below re-validates
# main/sandbox from the trusted branch definition the moment that happens.
# A forged same-name Actions check could only mask the advisory PR-time
# signal, never bypass the native code-owner review itself.

permissions:
  contents: read
  # checks/pull-requests: on branch pushes a FAILURE verdict is propagated
  # as an explicit check run onto every open PR head targeting that branch,
  # so a push that breaks CODEOWNERS immediately flips already-open PRs.
  # Successes are never pushed to heads (each PR re-earns green via its own
  # run), making stale-success races impossible by construction.
  checks: write
  pull-requests: read

on:
  # pull_request_target, NOT pull_request: this executes the workflow
  # definition from the PR's BASE branch (a protected branch here), so a PR
  # cannot edit this file to skip the check or force success. Safe because
  # the job performs no checkout and only makes one read-only API call
  # against the PR's head SHA (a server-provided value, never interpolated).
  # `edited` covers base-branch retargeting so a commit-scoped success from
  # an earlier base cannot go stale unnoticed after a retarget round-trip.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main
      - sandbox
  push:
    branches:
      - main
      - sandbox

jobs:
  codeowners-errors:
    runs-on: ubuntu-latest
    # Serialize runs per branch/PR (throttle). Correctness does not depend
    # on ordering: push runs only ever write FAILURE to PR heads, so no
    # stale-success write exists in any interleaving.
    concurrency:
      group: codeowners-validity-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Fail on any CODEOWNERS error
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // On PR events validate BOTH refs: the base branch holds the
            // CODEOWNERS GitHub actually enforces for this PR's review
            // requirement (its live state, hence the branch name), and the
            // head holds what this PR would make the enforced file for
            // every subsequent PR. On push events, the pushed commit.
            const refs = context.payload.pull_request
              ? [
                  context.payload.pull_request.base.ref,
                  context.payload.pull_request.head.sha,
                ]
              : [context.sha];

            // Syntax errors alone do not prove coverage: an empty or
            // comment-only CODEOWNERS is valid to the errors API yet leaves
            // the native owner rule with nobody to require (fail-open). So
            // each ref must ALSO contain at least one non-comment catch-all
            // rule (a line whose pattern is `*`); unknown/invalid owners on
            // that line are still caught by the errors API above.
            async function hasCatchAllRule(ref) {
              for (const path of [".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"]) {
                let content;
                try {
                  const { data } = await github.request(
                    "GET /repos/{owner}/{repo}/contents/{path}",
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      path: path,
                      ref: ref,
                    }
                  );
                  content = Buffer.from(data.content, "base64").toString("utf8");
                } catch (error) {
                  if (error.status === 404) {
                    continue;
                  }
                  throw error;
                }
                // GitHub uses the first CODEOWNERS it finds in precedence
                // order; judge coverage on that same file.
                return content.split("\n").some((line) => {
                  const trimmed = line.trim();
                  if (trimmed === "" || trimmed.startsWith("#")) {
                    return false;
                  }
                  const fields = trimmed.split(/\s+/);
                  return fields[0] === "*" && fields.length >= 2;
                });
              }
              return false;
            }

            // Validate one ref: API-reported errors plus catch-all coverage.
            async function validateRef(ref) {
              let errors = 0;
              // Raw endpoint call: immune to Octokit generated-method naming.
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/codeowners/errors",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: ref,
                }
              );
              for (const error of data.errors || []) {
                errors += 1;
                core.error(
                  `[${ref}] ${error.path}:${error.line} ${error.kind}: ${error.message}`
                );
              }
              if (!(await hasCatchAllRule(ref))) {
                errors += 1;
                core.error(
                  `[${ref}] CODEOWNERS has no catch-all (\`* @owner\`) rule - native code-owner review would have no owner to require for most paths (fail-open).`
                );
              }
              return errors;
            }

            let totalErrors = 0;
            let validationError = false;
            try {
              for (const ref of refs) {
                totalErrors += await validateRef(ref);
              }
            } catch (error) {
              // Fail CLOSED on both paths: the verdict becomes failure and is
              // still published explicitly below (never an early exit that
              // would leave a previous success standing).
              validationError = true;
              core.error(`Validation could not complete: ${error.message}`);
            }

            // PR events: publish the verdict EXPLICITLY on the PR head SHA,
            // so the required check is present on the commit being merged
            // independent of how the event's implicit job check associates.
            if (context.payload.pull_request) {
              let conclusion =
                totalErrors > 0 || validationError ? "failure" : "success";
              if (conclusion === "success") {
                // Revalidate the LIVE base immediately before publishing: the
                // base may have changed while this run validated the head. A
                // base-breaking push also propagates failures itself (below,
                // in its own run), which is the corrective backstop for any
                // residual interleaving.
                try {
                  const baseErrors = await validateRef(
                    context.payload.pull_request.base.ref
                  );
                  if (baseErrors > 0) {
                    totalErrors += baseErrors;
                    conclusion = "failure";
                  }
                } catch (error) {
                  validationError = true;
                  conclusion = "failure";
                  core.error(`Base revalidation failed: ${error.message}`);
                }
              }
              try {
                await github.request("POST /repos/{owner}/{repo}/check-runs", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: "codeowners-errors",
                  head_sha: context.payload.pull_request.head.sha,
                  status: "completed",
                  conclusion: conclusion,
                  output: {
                    title: "CODEOWNERS validity",
                    summary:
                      conclusion === "success"
                        ? "CODEOWNERS is valid on the base branch and on this PR's proposed head."
                        : "CODEOWNERS is invalid or could not be validated on the base branch or this PR's head - invalid entries fail OPEN; fix before merging.",
                  },
                });
              } catch (error) {
                validationError = true;
                core.error(`Could not publish PR-head check: ${error.message}`);
              }
            }

            // Branch pushes: propagate the verdict onto every open PR head
            // targeting this branch. Their earlier validity checks were
            // computed against the previous base state; a push that breaks
            // (or fixes) the branch's CODEOWNERS must be reflected on those
            // heads immediately, not at their next PR event.
            if (!context.payload.pull_request) {
              const branch = context.ref.replace("refs/heads/", "");
              const conclusion =
                totalErrors > 0 || validationError ? "failure" : "success";
              // Push runs propagate FAILURE ONLY. A success is never written
              // to PR heads from this path, which makes a stale success
              // impossible BY CONSTRUCTION - there is no freshness probe to
              // race and no read-then-write window to exploit. Failure is
              // always safe to write (fail-closed), and after a fix lands on
              // the base, each PR's verdict returns to green via its own
              // pull_request_target run (next push/edit) or a manual re-run.
              if (conclusion === "success") {
                core.info(
                  `Base ${branch} CODEOWNERS valid; PR-head verdicts refresh on their own events.`
                );
                return;
              }
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                base: branch,
                per_page: 100,
              });
              for (const pr of prs) {
                if (!pr.head || typeof pr.head.sha !== "string") {
                  continue;
                }
                try {
                  await github.request("POST /repos/{owner}/{repo}/check-runs", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: "codeowners-errors",
                    head_sha: pr.head.sha,
                    status: "completed",
                    conclusion: "failure",
                    output: {
                      title: "CODEOWNERS validity",
                      summary: `Base branch ${branch} has CODEOWNERS problems (or could not be validated) - the native owner rule may be fail-open until fixed on ${branch}. Re-run this check (or push to the PR) after the fix to go green.`,
                    },
                  });
                  core.info(`Propagated failure to PR #${pr.number} head.`);
                } catch (error) {
                  // One head's write must not block the rest; the job still
                  // fails below so the miss is visible and retried.
                  validationError = true;
                  core.error(
                    `Could not propagate to PR #${pr.number}: ${error.message}`
                  );
                }
              }
            }

            if (totalErrors > 0 || validationError) {
              core.setFailed(
                `${totalErrors} CODEOWNERS error(s)` +
                  (validationError ? " plus validation/propagation API failure(s)" : "") +
                  " - invalid entries fail OPEN, fix before merging."
              );
            } else {
              core.info("CODEOWNERS is valid on all checked refs.");
            }
