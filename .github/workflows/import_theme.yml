name: Import theme

on:
  workflow_dispatch:
    inputs:
      brandId:
        description: 'Brand ID'
        required: true
      branchName:
        description: 'Branch Name'
        required: true
        type: choice
        options:
          - main
          - sandbox

permissions:
  contents: read

concurrency:
  group: update-theme-${{ github.event.inputs.branchName }}
  cancel-in-progress: true

jobs:
  import_theme:
    # SECURITY: fail closed at runtime. `type: choice` constrains the web UI,
    # but the input value must never be trusted to be one of the options when
    # it is about to select a checkout ref and a credential set - so only the
    # two reviewed deploy branches are accepted. The dispatch ref (the branch
    # whose copy of this workflow definition runs) is restricted to the same
    # protected branches, so a modified copy of this YAML on an unprotected
    # branch never executes with the Zendesk secrets.
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sandbox') &&
      (github.event.inputs.branchName == 'main' || github.event.inputs.branchName == 'sandbox')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branchName }}

      # SECURITY: importTheme.js is intentionally executed from the same
      # reviewed ref that is being deployed (the branchName checkout above).
      # The previous 'scriptBranch' input fetched and ran the script from an
      # arbitrary branch with production Zendesk tokens in the environment,
      # letting anyone with dispatch rights run unreviewed code with prod
      # credentials even when main/sandbox are branch-protected.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # SECURITY: this workflow zips the checked-out ref directly. Without a
      # build step here, the `assets/*-bundle.js` files zipped are whatever is
      # committed to git, not a rebuild from the current source - so source
      # fixes (e.g. sanitizer changes) that haven't also had their bundle
      # regenerated and committed would silently be absent from this deploy
      # path.
      - name: Build theme assets
        run: yarn build

      - name: Zip theme files
        run: |
          zip -r theme.zip . -x ".*" -x "node_modules/*"
          mv theme.zip ./.github/workflows/scripts/

      - name: Run importTheme.js
        run: node ./.github/workflows/scripts/importTheme.js ./.github/workflows/scripts/theme.zip
        env:
          BRAND_ID: ${{ github.event.inputs.brandId }}
          ZENDESK_SUBDOMAIN: ${{ github.event.inputs.branchName == 'sandbox' && secrets.SANDBOX_DOMAIN || secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_TOKEN: ${{ github.event.inputs.branchName == 'sandbox' && secrets.SANDBOX_TOKEN || secrets.ZENDESK_TOKEN }}

      - name: Upload theme file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-file
          path: ./.github/workflows/scripts/theme.zip