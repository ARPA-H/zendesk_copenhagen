name: Validate CODEOWNERS

# GitHub silently ignores CODEOWNERS rules whose owners it cannot resolve, so
# a stale team, a typo, or an owner who lost write access disables code-owner
# review for those paths with no warning anywhere in the UI. This workflow
# turns that silent fail-open into a failing check.

permissions:
  contents: read

on:
  # No `paths:` filter on pull_request: this job's check ("Validate
  # CODEOWNERS") is REQUIRED by the branch Ruleset, and a required check
  # whose workflow is path-filtered never reports on non-matching PRs -
  # they hang at "Expected - Waiting" and can never merge. The job is two
  # API calls, so it simply runs on every PR.
  #
  # BOOTSTRAP CAVEAT: `pull_request` executes the workflow definition from
  # the PR's MERGE REF, so a PR author can edit this file to always
  # succeed. That is accepted only to bootstrap (a pull_request_target
  # version cannot produce its own required check before the file exists
  # on the base branch). Once this file is on main+sandbox, flip this
  # trigger to `pull_request_target` (trusted base-branch definition) -
  # the job's check name is unchanged, so the Ruleset needs no edit.
  # Until then, and in general, native code-owner review is the
  # authorization boundary; this check guards the fail-open
  # invalid-CODEOWNERS class, not merge authorization.
  pull_request:
  push:
    branches:
      - main
      - sandbox
  workflow_dispatch:

jobs:
  validate:
    name: Validate CODEOWNERS
    runs-on: ubuntu-latest
    steps:
      # No checkout: the errors endpoint evaluates the file server-side at the
      # given ref, which is also the only way to resolve owner membership.
      # Untrusted values are passed through env, never interpolated into the
      # shell.
      - name: Check CODEOWNERS resolves
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # github.sha is the MERGE COMMIT on pull_request events (so the
          # validated file includes both head- and base-side changes, and
          # fork head SHAs are never needed) and the event commit on push
          # and manual dispatch.
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! response=$(gh api "repos/${REPO}/codeowners/errors?ref=${REF}" 2>&1); then
            echo "::error::Could not read CODEOWNERS errors for ${REF}: ${response}"
            exit 1
          fi

          count=$(printf '%s' "$response" | jq '.errors | length')

          if [ "$count" -eq 0 ]; then
            echo "CODEOWNERS is valid at ${REF}: every owner resolves."
            echo "CODEOWNERS is valid: every owner resolves." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::CODEOWNERS has ${count} unresolved entr(ies). Code-owner review is silently DISABLED for the affected paths."
          printf '%s' "$response" | jq -r '
            .errors[]
            | "::error file=\(.path),line=\(.line),col=\(.column)::\(.kind): \(.suggestion // "invalid CODEOWNERS entry")"
          '
          {
            echo "## CODEOWNERS is invalid"
            echo
            echo "GitHub ignores unresolvable rules, so these paths currently have **no owner**"
            echo "and any \`require_code_owner_review\` rule covering them is vacuously satisfied."
            echo
            printf '%s' "$response" | jq -r '.errors[] | "- `\(.path)` line \(.line): **\(.kind)** — \(.suggestion // "invalid entry")"'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
