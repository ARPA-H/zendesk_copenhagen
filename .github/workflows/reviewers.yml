name: Enforce Required Reviewers

# SECURITY NOTE: this job intentionally performs NO checkout. The reviewer
# allowlist is fetched from the PR *base* branch via the API, so a pull
# request can never ship its own .github/allowed-reviewers.txt to satisfy the
# gate, and the file content is handled as data (never interpolated into the
# script with ${{ }}).
#
# Residual risk (cannot be fixed inside this file): a plain `pull_request`
# workflow definition executes from the PR merge ref, so a collaborator PR
# could still rewrite this workflow itself. The check is only trustworthy if
# a branch-protection Ruleset on `main` (a) requires the "Authorized Reviewer
# Check" from this repository's GitHub App specifically and (b) restricts who
# can approve/merge. Prefer GitHub's native required-reviewers/CODEOWNERS
# enforcement where possible.

permissions:
  contents: read

on:
  pull_request_review:
    # `dismissed` re-runs the gate when an approval is dismissed, so the
    # check flips back to failure instead of keeping the stale green state.
    types: [submitted, dismissed]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  launch-reviewer-check:
    runs-on: ubuntu-latest
    # SECURITY: pull_request_review carries no `branches` filter, so without
    # this guard the job would also run for PRs targeting unprotected
    # branches, where the base-branch allowlist is attacker-editable. The
    # gate only protects main, so only evaluate it there.
    if: github.event.pull_request.base.ref == 'main'
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        # SECURITY: least-privilege token. This job only reads the allowlist
        # file and PR reviews and writes a check run; without these inputs the
        # token would inherit every permission granted to the App
        # installation.
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
        permission-pull-requests: read
        permission-checks: write

    - name: Check if approved by authorized reviewer
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const FALLBACK_REVIEWERS = ["ksavilaNIH", "petersonjdNIH"];
          const ALLOWLIST_PATH = ".github/allowed-reviewers.txt";

          // Read the allowlist from the base branch of the PR (the protected
          // target), never from the PR head, so PR authors cannot edit it.
          let allowedReviewers = FALLBACK_REVIEWERS;
          try {
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ALLOWLIST_PATH,
              ref: context.payload.pull_request.base.ref,
            });
            const content = Buffer.from(data.content, "base64").toString("utf8");
            // An existing file is authoritative even when empty: an
            // intentionally emptied allowlist means "nobody may approve",
            // and must not silently re-enable the hardcoded fallback.
            allowedReviewers = content.split(/\s+/).filter(Boolean);
          } catch (error) {
            // Only a missing allowlist file falls back to the hardcoded list.
            if (error.status !== 404) {
              throw error;
            }
          }

          // Fetch ALL reviews (paginated) and reduce to each reviewer's
          // latest effective state: an APPROVED entry in the history must not
          // count once that reviewer later requested changes or had the
          // approval dismissed. COMMENTED reviews do not change the effective
          // state (matching GitHub's own review semantics).
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            per_page: 100,
          });

          const STATE_CHANGING = ["APPROVED", "CHANGES_REQUESTED", "DISMISSED"];
          const latestStateByReviewer = new Map();
          for (const review of reviews) {
            if (review.user && STATE_CHANGING.includes(review.state)) {
              latestStateByReviewer.set(review.user.login, review.state);
            }
          }

          const hasValidApproval = allowedReviewers.some(
            (login) => latestStateByReviewer.get(login) === "APPROVED"
          );

          // Create a check run
          const checkName = "Authorized Reviewer Check";
          const conclusion = hasValidApproval ? "success" : "failure";
          const output = {
            title: checkName,
            summary: hasValidApproval
              ? "✅ Approved by authorized reviewer"
              : "❌ Requires approval from: " + allowedReviewers.join(", "),
          };

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: checkName,
            head_sha: context.payload.pull_request?.head.sha || context.sha,
            status: "completed",
            conclusion: conclusion,
            output: output,
          });
