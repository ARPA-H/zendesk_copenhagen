name: Enforce Required Reviewers

# SECURITY DESIGN
#
# This gate runs ONLY from triggers whose workflow definition is taken from
# the repository's DEFAULT BRANCH (pull_request_target, issue_comment, push,
# schedule), never from the pull request merge ref. A PR therefore cannot
# rewrite this workflow to forge its own passing check, and it never sees the
# GitHub App credentials. The job performs NO checkout at all - every input
# (allowlist, reviews, head SHA) is fetched from the API using trusted
# identifiers, which is what makes pull_request_target safe to use here.
#
# Re-evaluation paths (pull_request_target has no review activity types):
#   - an allowlisted reviewer comments exactly "/recheck" on the PR
#     (immediate; author is verified against the allowlist in-script)
#   - a push to main that changes the allowlist re-evaluates all open PRs
#   - a half-hourly schedule re-evaluates all open PRs, so dismissed or
#     superseded approvals converge to failure without manual action
#
# Companion repo settings (required for the check to be meaningful): a
# branch-protection Ruleset on `main` that requires the "Authorized Reviewer
# Check" from this repository's GitHub App and restricts who can merge.
# Prefer GitHub's native required-reviewers/CODEOWNERS enforcement where
# possible - this workflow exists to enforce a named allowlist without
# CODEOWNERS.

permissions:
  contents: read

on:
  pull_request_target:
    # `edited` covers base-branch changes: a PR retargeted away from main and
    # back must be re-evaluated (the script skips non-main bases, so the
    # extra events are cheap no-ops).
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      # Policy change: re-evaluate all open PRs.
      - '.github/allowed-reviewers.txt'
      # Gate change (including the rollout of this very fix): sweep
      # immediately so checks minted by the previous gate version are
      # recomputed instead of lingering until the next scheduled run.
      - '.github/workflows/reviewers.yml'
  schedule:
    - cron: '23,53 * * * *'

jobs:
  launch-reviewer-check:
    runs-on: ubuntu-latest
    # Comments: only PR comments spelling exactly "/recheck" proceed (the
    # author must additionally be on the allowlist, verified in-script; the
    # body is only ever compared for equality, never interpolated).
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/recheck')
    # Serialize ALL check writers in one group, at the JOB level so runs
    # filtered out by the `if` above (e.g. arbitrary comments) never enter
    # the group and cannot displace privileged runs. cancel-in-progress is
    # false: an in-flight evaluation always finishes, later runs queue (the
    # newest queued run subsumes displaced ones since every run re-reads all
    # state), so two writers can never publish checks out of order.
    concurrency:
      group: reviewer-check
      cancel-in-progress: false
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        # SECURITY: least-privilege token. This job only reads the allowlist
        # file and PR reviews and writes a check run; without these inputs the
        # token would inherit every permission granted to the App
        # installation.
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
        permission-pull-requests: read
        permission-checks: write

    - name: Check if approved by authorized reviewer
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const FALLBACK_REVIEWERS = ["ksavilaNIH", "petersonjdNIH"];
          const ALLOWLIST_PATH = ".github/allowed-reviewers.txt";
          const PROTECTED_BASE = "main";

          // Read the allowlist from the protected base branch, never from a
          // PR head, so PR authors cannot edit it.
          let allowedReviewers = FALLBACK_REVIEWERS;
          let policyReadFailed = false;
          try {
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ALLOWLIST_PATH,
              ref: PROTECTED_BASE,
            });
            const content = Buffer.from(data.content, "base64").toString("utf8");
            // An existing file is authoritative even when empty: an
            // intentionally emptied allowlist means "nobody may approve",
            // and must not silently re-enable the hardcoded fallback.
            allowedReviewers = content.split(/\s+/).filter(Boolean);
          } catch (error) {
            // Only a missing allowlist file falls back to the hardcoded list.
            // Any other read failure fails CLOSED: evaluate with an empty
            // allowlist so a failure check replaces any previously green
            // result, instead of aborting and leaving a stale success
            // satisfying branch protection.
            if (error.status !== 404) {
              core.warning(`Allowlist read failed (${error.status}); failing closed.`);
              policyReadFailed = true;
              allowedReviewers = [];
            }
          }

          // Determine which PRs to evaluate. The only event-payload values
          // used are PR numbers and (for comments) the commenter login; all
          // security-relevant data is re-fetched server-side below.
          let prNumbers = [];
          if (context.eventName === "pull_request_target") {
            prNumbers = [context.payload.pull_request.number];
          } else if (context.eventName === "issue_comment") {
            // Only allowlisted reviewers may trigger a privileged
            // re-evaluation from a comment; with unreadable policy the
            // commenter cannot be verified, so comment triggers are ignored
            // (trusted-source events below still publish fail-closed checks).
            const commenter = context.payload.comment?.user?.login;
            if (policyReadFailed || !commenter || !allowedReviewers.includes(commenter)) {
              core.info("Commenter not verifiable against the allowlist; skipping.");
              return;
            }
            prNumbers = [context.payload.issue.number];
          } else {
            // push (allowlist changed) or schedule: re-evaluate every open PR
            // targeting the protected base so policy changes and dismissed
            // approvals converge without manual action.
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: PROTECTED_BASE,
              per_page: 100,
            });
            prNumbers = openPrs.map((pr) => pr.number);
          }

          const STATE_CHANGING = ["APPROVED", "CHANGES_REQUESTED", "DISMISSED"];
          const checkName = "Authorized Reviewer Check";

          for (const prNumber of prNumbers) {
            if (!Number.isInteger(prNumber)) {
              continue;
            }

            // Fetch the PR from the API so the base ref and head SHA are
            // server-provided values, not event-payload values.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.base.ref !== PROTECTED_BASE) {
              core.info(`PR #${prNumber} targets ${pr.base.ref}; skipping.`);
              continue;
            }

            // Fetch ALL reviews (paginated) and reduce to each reviewer's
            // latest state-changing entry by submitted_at, independent of API
            // ordering: an APPROVED entry must not count once that reviewer
            // later requested changes or had the approval dismissed.
            // COMMENTED reviews do not change the effective state (matching
            // GitHub's own review semantics).
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (!review.user || !STATE_CHANGING.includes(review.state)) {
                continue;
              }
              const previous = latestByReviewer.get(review.user.login);
              if (
                !previous ||
                new Date(review.submitted_at) > new Date(previous.submitted_at)
              ) {
                latestByReviewer.set(review.user.login, review);
              }
            }

            // An approval only counts when it is the reviewer's latest
            // state-changing review AND it reviewed the current head SHA, so
            // a push after approval invalidates it (stale-approval
            // semantics).
            const hasValidApproval = allowedReviewers.some((login) => {
              const review = latestByReviewer.get(login);
              return (
                review !== undefined &&
                review.state === "APPROVED" &&
                review.commit_id === pr.head.sha
              );
            });

            const conclusion = hasValidApproval ? "success" : "failure";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: pr.head.sha,
              status: "completed",
              conclusion: conclusion,
              output: {
                title: checkName,
                summary: hasValidApproval
                  ? "✅ Approved by authorized reviewer"
                  : policyReadFailed
                    ? "❌ Reviewer allowlist could not be read; failing closed until policy is readable"
                    : "❌ Requires approval of the current head commit from: " +
                      allowedReviewers.join(", ") +
                      " (an allowlisted reviewer can comment /recheck to refresh)",
              },
            });
            core.info(`PR #${prNumber}: ${conclusion}`);
          }
