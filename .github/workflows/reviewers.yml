name: Enforce Required Reviewers

# SECURITY DESIGN
#
# This gate runs ONLY from triggers whose workflow definition is taken from
# the repository's DEFAULT BRANCH (pull_request_target, issue_comment, push,
# schedule), never from the pull request merge ref. A PR therefore cannot
# rewrite this workflow to forge its own passing check, and it never sees the
# GitHub App credentials. The job performs NO checkout at all - every input
# (allowlist, reviews, head SHA) is fetched from the API using trusted
# identifiers, which is what makes pull_request_target safe to use here.
#
# Re-evaluation paths (pull_request_target has no review activity types):
#   - anyone comments exactly "/recheck" on a PR (immediate; safe because
#     every run performs the same deterministic full sweep - trigger
#     identity grants no privilege, and volume is bounded by the exact-body
#     filter plus the serialized single-slot writer queue)
#   - a push to main that changes the allowlist re-evaluates all open PRs
#   - a half-hourly schedule re-evaluates all open PRs, so dismissed or
#     superseded approvals converge to failure without manual action
#
# Known residuals - each is inherent to a commit-scoped Checks-API gate and
# each is closed natively by the companion Ruleset settings below:
#   - a head force-pushed BACK to a previously green SHA briefly re-exposes
#     that old check until the synchronize-triggered sweep replaces it (a
#     queue-latency window; approvals that predate the PR's latest
#     force-push are also rejected in-script, so the stale result can never
#     be RENEWED by a sweep)
#   - check runs attach to commits, not PRs: a newly opened/reopened PR
#     whose head SHA some other PR (possibly since closed) already turned
#     green can present that check until its own opened-event sweep
#     publishes the aggregated fail-closed result (again queue-latency)
#   - if the App token cannot be minted at all (revoked key, token-service
#     outage), no run can publish or replace App-owned checks. That is why a
#     second, always() step mirrors every verdict PER PR HEAD as the
#     "Reviewer Gate (Actions)" check using the workflow's own GITHUB_TOKEN:
#     when minting or the sweep fails, the mirror writes per-head FAILURE
#     checks instead, so requiring the mirror in the Ruleset makes a mint
#     outage fail closed on every PR head (a plain job check cannot do this:
#     on push/schedule runs it attaches to the default-branch SHA, not to PR
#     heads). The mirror is a LIVENESS fail-safe, not an authorization
#     signal - authorization always comes from the App-owned check, so a
#     forged mirror alone can never satisfy the gate.
#
# Companion repo settings (required for the check to be meaningful): a
# branch-protection Ruleset on `main` that (a) requires the "Authorized
# Reviewer Check" from this repository's GitHub App, (b) requires the
# "Reviewer Gate (Actions)" check from GitHub Actions, (c) enables "dismiss
# stale pull request approvals" and "require approval of the most recent
# reviewable push", and (d) restricts who can merge. Prefer GitHub's native
# required-reviewers/CODEOWNERS enforcement where possible - this workflow
# exists to enforce a named allowlist without CODEOWNERS.

permissions:
  contents: read

on:
  pull_request_target:
    # `edited` covers base-branch changes: a PR retargeted away from main and
    # back must be re-evaluated (the script skips non-main bases, so the
    # extra events are cheap no-ops).
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      # Policy change: re-evaluate all open PRs.
      - '.github/allowed-reviewers.txt'
      # Gate change (including the rollout of this very fix): sweep
      # immediately so checks minted by the previous gate version are
      # recomputed instead of lingering until the next scheduled run.
      - '.github/workflows/reviewers.yml'
  schedule:
    - cron: '23,53 * * * *'

jobs:
  launch-reviewer-check:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN scopes for the fail-safe mirror step (the gate itself uses
    # the least-privilege App token). This workflow only ever executes from
    # the default branch, so a PR cannot repurpose these grants.
    permissions:
      contents: read
      pull-requests: read
      checks: write
    # Comments: only PR comments spelling exactly "/recheck" proceed. The
    # body is only ever compared for equality, never interpolated, and the
    # commenter's identity is deliberately NOT a privilege: every run performs
    # the same deterministic full sweep, so who triggered it cannot change
    # what is written, and rejected-then-skipped runs never sit in the writer
    # queue where they would displace a pending sweep without doing its work.
    # pull_request_target events are deliberately NOT filtered (e.g. by
    # edited-base): an if-skipped job is reported as a PASSING check, so a
    # title/body edit after a failed run could replace the required
    # launch-reviewer-check failure with skipped-success. Running the full
    # serialized sweep on every edit costs no more than a /recheck and keeps
    # the job check fail-closed.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/recheck')
    # Serialize ALL check writers in one group, at the JOB level so runs
    # filtered out by the `if` above (e.g. arbitrary comments) never enter
    # the group and cannot displace privileged runs. cancel-in-progress is
    # false: an in-flight evaluation always finishes, later runs queue (the
    # newest queued run subsumes displaced ones since every run re-reads all
    # state), so two writers can never publish checks out of order.
    concurrency:
      group: reviewer-check
      cancel-in-progress: false
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        # SECURITY: least-privilege token. This job only reads the allowlist
        # file and PR reviews and writes a check run; without these inputs the
        # token would inherit every permission granted to the App
        # installation.
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
        permission-pull-requests: read
        # issues: read is required by the timeline-events read that supplies
        # the force-push cutoff (PR timelines live on the issues surface).
        permission-issues: read
        permission-checks: write

    - name: Check if approved by authorized reviewer
      id: gate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const FALLBACK_REVIEWERS = ["ksavilaNIH", "petersonjdNIH"];
          const ALLOWLIST_PATH = ".github/allowed-reviewers.txt";
          const PROTECTED_BASE = "main";
          const CHECK_NAME = "Authorized Reviewer Check";
          const STATE_CHANGING = ["APPROVED", "CHANGES_REQUESTED", "DISMISSED"];
          // The Checks API rejects output.summary beyond 65535 characters; a
          // rejected write would leave an older check standing, so displayed
          // text is bounded (the full allowlist is still used for matching).
          const MAX_LISTED_REVIEWERS = 15;
          const MAX_SUMMARY_CHARS = 60000;

          // Retry transient API failures (rate limits, 5xx) so one blip does
          // not leave stale check results standing; 404s are semantic and
          // never retried.
          async function withRetries(label, fn) {
            const MAX_ATTEMPTS = 3;
            for (let attempt = 1; ; attempt++) {
              try {
                return await fn();
              } catch (error) {
                if (attempt >= MAX_ATTEMPTS || error.status === 404) {
                  throw error;
                }
                core.warning(
                  `${label}: attempt ${attempt} failed (${error.message}); retrying`
                );
                await new Promise((resolve) => setTimeout(resolve, 1500 * attempt));
              }
            }
          }

          // Read the allowlist from the protected base branch, never from a
          // PR head, so PR authors cannot edit it. Extracted to a function
          // because the publish phase re-reads policy before any success is
          // published (a mid-sweep policy change must not ship on old policy).
          async function readAllowlist() {
            try {
              const { data } = await withRetries("allowlist read", () =>
                github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: ALLOWLIST_PATH,
                  ref: PROTECTED_BASE,
                })
              );
              const content = Buffer.from(data.content, "base64").toString("utf8");
              // An existing file is authoritative even when empty: an
              // intentionally emptied allowlist means "nobody may approve",
              // and must not silently re-enable the hardcoded fallback.
              return { list: content.split(/\s+/).filter(Boolean), failed: false };
            } catch (error) {
              if (error.status === 404) {
                // A 404 does not by itself prove the file is absent: an
                // unreadable/missing protected ref surfaces the same way.
                // Only fall back to the hardcoded list when the protected ref
                // is provably readable (so the 404 really means "no policy
                // file"); otherwise fail closed like any other policy-read
                // failure.
                try {
                  await withRetries("protected ref probe", () =>
                    github.rest.git.getRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `heads/${PROTECTED_BASE}`,
                    })
                  );
                  core.info("Allowlist file absent; using hardcoded fallback.");
                  return { list: FALLBACK_REVIEWERS, failed: false };
                } catch (probeError) {
                  core.warning(
                    `Allowlist 404 with unreadable ${PROTECTED_BASE} ref; failing closed.`
                  );
                  return { list: [], failed: true };
                }
              }
              // Fail CLOSED: evaluate with an empty allowlist so a failure
              // check replaces any previously green result, instead of
              // aborting and leaving a stale success satisfying branch
              // protection.
              core.warning(`Allowlist read failed (${error.status}); failing closed.`);
              return { list: [], failed: true };
            }
          }

          const initialPolicy = await readAllowlist();
          let allowedReviewers = initialPolicy.list;
          let policyReadFailed = initialPolicy.failed;

          let sweepErrors = 0;

          // Evaluate one PR from live API state. `seedSha` (from the sweep's
          // enumeration) keeps a fail-closed head attribution when pulls.get
          // itself fails. Used both for the sweep and for the pre-publish
          // freshness re-read.
          async function evaluatePr(prNumber, seedSha) {
            const result = {
              headSha: seedSha ?? null,
              approved: false,
              evalError: false,
              excluded: false,
            };
            try {
              // Fetch the PR so base ref and head SHA are current
              // server-provided values.
              const { data: pr } = await withRetries(`pulls.get #${prNumber}`, () =>
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })
              );
              result.headSha = pr.head.sha;

              if (pr.state !== "open") {
                // Closed after enumeration: it no longer gates anything and
                // must not drag a shared-head live PR to failure.
                core.info(`PR #${prNumber} closed mid-sweep; excluded.`);
                result.excluded = true;
                result.headSha = null;
                return result;
              }

              if (pr.base.ref !== PROTECTED_BASE) {
                // Retargeted mid-sweep: contribute a fail-closed verdict for
                // aggregation (a shared-head main PR must not inherit green)
                // rather than skipping.
                core.info(`PR #${prNumber} now targets ${pr.base.ref}; fail-closed.`);
                return result;
              }

              // An approval must postdate the PR's latest force-push:
              // review.commit_id alone cannot invalidate an approval after an
              // A -> B -> A force-push, because the stale approval of A
              // matches again once the head returns to A. Returning to a
              // previous SHA always requires a force-push, so the latest
              // head_ref_force_pushed TIMELINE event is a sufficient cutoff
              // (ordinary pushes always produce a new SHA, which the
              // commit_id comparison already rejects). The timeline API is
              // used because the classic issue-events endpoint does not carry
              // head_ref_force_pushed.
              const events = await withRetries(`timeline #${prNumber}`, () =>
                github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                })
              );
              let lastForcePushAt = 0;
              for (const event of events) {
                if (event.event === "head_ref_force_pushed" && event.created_at) {
                  lastForcePushAt = Math.max(
                    lastForcePushAt,
                    Number(new Date(event.created_at))
                  );
                }
              }

              // Fetch ALL reviews (paginated) and reduce to each reviewer's
              // latest state-changing entry by submitted_at, independent of
              // API ordering: an APPROVED entry must not count once that
              // reviewer later requested changes or had the approval
              // dismissed. COMMENTED reviews do not change the effective
              // state (matching GitHub's own semantics).
              const reviews = await withRetries(`reviews #${prNumber}`, () =>
                github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                })
              );

              const latestByReviewer = new Map();
              for (const review of reviews) {
                if (!review.user || !STATE_CHANGING.includes(review.state)) {
                  continue;
                }
                // Order-independent reduction with a deterministic
                // tie-breaker: submitted_at has second precision, so two
                // state changes by the same reviewer can share a timestamp -
                // the higher (later-created) review id wins.
                const previous = latestByReviewer.get(review.user.login);
                const later =
                  !previous ||
                  new Date(review.submitted_at) > new Date(previous.submitted_at) ||
                  (Number(new Date(review.submitted_at)) ===
                    Number(new Date(previous.submitted_at)) &&
                    review.id > previous.id);
                if (later) {
                  latestByReviewer.set(review.user.login, review);
                }
              }

              // An approval only counts when it is the reviewer's latest
              // state-changing review, it reviewed the current head SHA, and
              // it postdates the latest force-push - so a push after
              // approval invalidates it and a force-push round-trip cannot
              // resurrect it.
              result.approved = allowedReviewers.some((login) => {
                const review = latestByReviewer.get(login);
                return (
                  review !== undefined &&
                  review.state === "APPROVED" &&
                  review.commit_id === result.headSha &&
                  Number(new Date(review.submitted_at)) > lastForcePushAt
                );
              });
            } catch (error) {
              sweepErrors += 1;
              result.evalError = true;
              core.warning(`PR #${prNumber}: evaluation failed: ${error.message}`);
            }
            return result;
          }

          // EVERY run evaluates EVERY open PR targeting the protected base.
          // Runs in the shared concurrency group displace each other's single
          // pending slot, so per-event scoping could drop a queued sweep;
          // making all runs full sweeps means any displaced run is completely
          // subsumed by the newer one. No event-payload value influences
          // which PRs are examined or what is written.
          let openPrs;
          try {
            openPrs = await withRetries("pulls.list", () =>
              github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                base: PROTECTED_BASE,
                per_page: 100,
              })
            );
          } catch (error) {
            // Without the PR list there is nothing to write against. Mark
            // the run failed so the outage is visible; the next queued or
            // scheduled sweep (at most ~30 minutes) retries. Residual: a
            // check computed before a sustained API outage stays in place
            // for the outage's duration - inherent to any API-driven gate.
            core.setFailed(`Could not enumerate open PRs after retries: ${error.message}`);
            return;
          }

          // Phase 1: evaluate every PR. Phase 2: publish ONE check per head
          // SHA, aggregated fail-closed - check runs attach to commits, not
          // PRs, so when two open PRs share a head SHA the shared check may
          // only be a success if EVERY sharing PR holds a valid approval
          // (otherwise one PR's approval would leak to the other).
          const aggregateBySha = new Map();

          for (const listedPr of openPrs) {
            const prNumber = listedPr.number;
            if (!Number.isInteger(prNumber)) {
              continue;
            }

            // Seeded from the list response so a failing pulls.get still
            // contributes a fail-closed aggregate for this head.
            const outcome = await evaluatePr(prNumber, listedPr.head?.sha ?? null);
            if (outcome.excluded || !outcome.headSha) {
              continue;
            }

            const aggregate = aggregateBySha.get(outcome.headSha) ?? {
              prNumbers: [],
              allApproved: true,
              anyError: false,
            };
            aggregate.prNumbers.push(prNumber);
            aggregate.allApproved =
              aggregate.allApproved && outcome.approved && !outcome.evalError;
            aggregate.anyError = aggregate.anyError || outcome.evalError;
            aggregateBySha.set(outcome.headSha, aggregate);
          }

          const displayedReviewers =
            allowedReviewers.length > MAX_LISTED_REVIEWERS
              ? allowedReviewers.slice(0, MAX_LISTED_REVIEWERS).join(", ") +
                `, and ${allowedReviewers.length - MAX_LISTED_REVIEWERS} more`
              : allowedReviewers.join(", ");

          // Policy freshness: the sweep evaluated against the allowlist read
          // at run start. If the protected allowlist changed (or became
          // unreadable) while PRs were being evaluated, no SUCCESS computed
          // from the old policy may be published - the queued push-triggered
          // sweep will recompute from the new policy.
          let policyChangedDuringSweep = false;
          if ([...aggregateBySha.values()].some((a) => a.allApproved)) {
            const freshPolicy = await readAllowlist();
            const sameList =
              !freshPolicy.failed &&
              !policyReadFailed &&
              JSON.stringify([...allowedReviewers].sort()) ===
                JSON.stringify([...freshPolicy.list].sort());
            if (!sameList) {
              core.warning("Allowlist changed mid-sweep; downgrading successes.");
              policyChangedDuringSweep = true;
            }
          }

          // Every published verdict is exported for the fail-safe mirror step
          // (which re-publishes them per head with the workflow's own token).
          const publishedVerdicts = [];

          for (const [headSha, aggregate] of aggregateBySha) {
            let conclusion = aggregate.allApproved ? "success" : "failure";
            let staleDowngrade = false;
            if (conclusion === "success" && policyChangedDuringSweep) {
              conclusion = "failure";
              staleDowngrade = true;
            }

            // Pre-publish freshness re-read: the verdict above was computed
            // from reads taken earlier in the sweep, and review or policy
            // state may have changed while other PRs were being evaluated.
            // Re-evaluate each sharing PR immediately before publishing a
            // SUCCESS; any divergence (new head, lost approval, read error)
            // downgrades to failure - fail-closed - and the next queued or
            // scheduled sweep recomputes from scratch. (Failure verdicts
            // need no re-read: publishing a failure is already the
            // conservative outcome.)
            if (conclusion === "success") {
              for (const prNumber of aggregate.prNumbers) {
                const fresh = await evaluatePr(prNumber, headSha);
                if (fresh.excluded) {
                  continue;
                }
                if (fresh.evalError || !fresh.approved || fresh.headSha !== headSha) {
                  conclusion = "failure";
                  staleDowngrade = true;
                  break;
                }
              }
            }
            publishedVerdicts.push({ headSha, conclusion });

            const sharedSuffix =
              aggregate.prNumbers.length > 1
                ? ` [aggregated across PRs ${aggregate.prNumbers.join(", ")} sharing this head commit]`
                : "";
            const summary = (
              conclusion === "success"
                ? "✅ Approved by authorized reviewer" + sharedSuffix
                : staleDowngrade
                  ? "❌ Review or policy state changed while this sweep was evaluating; failing closed pending the already-queued re-evaluation"
                  : aggregate.anyError
                    ? "❌ Evaluation could not complete (API error - see the workflow run log); failing closed until a sweep succeeds"
                    : policyReadFailed
                      ? "❌ Reviewer allowlist could not be read; failing closed until policy is readable"
                      : allowedReviewers.length === 0
                        ? "❌ The reviewer allowlist is intentionally empty: current policy permits no one to approve"
                        : "❌ Requires approval of the current head commit from: " +
                          displayedReviewers +
                          sharedSuffix +
                          " (comment /recheck after approving to refresh)"
            ).slice(0, MAX_SUMMARY_CHARS);

            try {
              // Retried like every other API call: a dropped write here could
              // leave an older success standing on this head.
              await withRetries(`checks.create ${headSha.slice(0, 7)}`, () =>
                github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: CHECK_NAME,
                  head_sha: headSha,
                  status: "completed",
                  conclusion: conclusion,
                  output: { title: CHECK_NAME, summary: summary },
                })
              );
              core.info(
                `${headSha.slice(0, 7)} (PR ${aggregate.prNumbers.join(", ")}): ${conclusion}`
              );
            } catch (error) {
              sweepErrors += 1;
              core.warning(
                `Check for ${headSha} could not be written: ${error.message}`
              );
            }
          }

          core.setOutput("verdicts", JSON.stringify(publishedVerdicts));

          if (sweepErrors > 0) {
            core.setFailed(`${sweepErrors} evaluation step(s) failed; see warnings.`);
          }

    - name: Publish fail-safe mirror check
      # Runs even when App-token minting or the sweep fails (if: always()).
      # The mirror is written with the workflow's own GITHUB_TOKEN, so an
      # App-token outage cannot leave PR heads without a current verdict:
      # when the gate step did not complete successfully, every open PR head
      # receives a FAILURE mirror check. Requiring "Reviewer Gate (Actions)"
      # in the Ruleset therefore makes mint/sweep outages fail closed PER
      # HEAD - something the job's own check cannot provide, since on
      # push/schedule runs that attaches to the default-branch commit, not to
      # PR heads. The mirror is a liveness fail-safe only: authorization is
      # always carried by the App-owned "Authorized Reviewer Check".
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        GATE_VERDICTS: ${{ steps.gate.outputs.verdicts }}
      with:
        script: |
          const MIRROR_CHECK_NAME = "Reviewer Gate (Actions)";
          const PROTECTED_BASE = "main";

          async function withRetries(label, fn) {
            const MAX_ATTEMPTS = 3;
            for (let attempt = 1; ; attempt++) {
              try {
                return await fn();
              } catch (error) {
                if (attempt >= MAX_ATTEMPTS || error.status === 404) {
                  throw error;
                }
                core.warning(
                  `${label}: attempt ${attempt} failed (${error.message}); retrying`
                );
                await new Promise((resolve) => setTimeout(resolve, 1500 * attempt));
              }
            }
          }

          const gateSucceeded = process.env.GATE_OUTCOME === "success";
          let verdicts = [];
          try {
            verdicts = JSON.parse(process.env.GATE_VERDICTS || "[]");
          } catch (error) {
            verdicts = [];
          }

          const byHead = new Map();
          if (gateSucceeded) {
            for (const verdict of verdicts) {
              if (verdict && typeof verdict.headSha === "string") {
                byHead.set(
                  verdict.headSha,
                  verdict.conclusion === "success" ? "success" : "failure"
                );
              }
            }
          }

          if (!gateSucceeded) {
            // The gate could not complete (token mint failure, enumeration
            // failure, or per-PR errors): fail closed on every open PR head
            // this token can see, replacing any previously green mirror.
            let openPrs = [];
            try {
              openPrs = await withRetries("pulls.list (mirror)", () =>
                github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  base: PROTECTED_BASE,
                  per_page: 100,
                })
              );
            } catch (error) {
              core.setFailed(
                `Mirror could not enumerate open PRs: ${error.message}`
              );
              return;
            }
            for (const pr of openPrs) {
              if (pr.head && pr.head.sha) {
                byHead.set(pr.head.sha, "failure");
              }
            }
          }

          let mirrorErrors = 0;
          for (const [headSha, conclusion] of byHead) {
            const summary =
              conclusion === "success"
                ? "Liveness mirror of the App-published Authorized Reviewer Check for this head. Authorization is carried by the App check; this check only proves the gate's latest sweep completed."
                : "Fail-safe: the reviewer gate could not complete its sweep for this head (or the head failed evaluation); failing closed until a sweep succeeds.";
            try {
              await withRetries(`mirror ${headSha.slice(0, 7)}`, () =>
                github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: MIRROR_CHECK_NAME,
                  head_sha: headSha,
                  status: "completed",
                  conclusion: conclusion,
                  output: { title: MIRROR_CHECK_NAME, summary: summary },
                })
              );
            } catch (error) {
              mirrorErrors += 1;
              core.warning(
                `Mirror check for ${headSha} could not be written: ${error.message}`
              );
            }
          }

          if (mirrorErrors > 0) {
            core.setFailed(`${mirrorErrors} mirror check(s) could not be written.`);
          }
