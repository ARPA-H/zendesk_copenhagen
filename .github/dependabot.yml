# Dependabot version updates for all package ecosystems used in this repo.
# Every ecosystem targets the `sandbox` branch so update PRs never go to `main`.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # Yarn (yarn.lock) is handled by the npm ecosystem
    directory: "/"
    target-branch: "sandbox"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/" # Scans .github/workflows
    target-branch: "sandbox"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/" # Scans .devcontainer/devcontainer.json
    target-branch: "sandbox"
    schedule:
      interval: "weekly"
