<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OS article tabs preview</title>
    <style>
      :root {
        color: #2f3941;
        font-family: Arial, sans-serif;
        font-synthesis: none;
      }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background: #f8f9f9;
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem;
        border: 1px solid #d8dcde;
        border-radius: 0.5rem;
        background: #fff;
        box-shadow: 0 0.25rem 1rem rgb(31 39 46 / 8%);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        color: #68737d;
      }

      [role="tablist"] {
        display: flex;
        gap: 0.5rem;
        margin-top: 1.5rem;
        border-bottom: 1px solid #d8dcde;
      }

      .os-tab {
        min-width: 3.5rem;
        padding: 0.75rem 1rem;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: #2f3941;
        cursor: pointer;
        font-size: 0;
      }

      .os-tab[aria-selected="true"] {
        border-bottom-color: #17494d;
      }

      .os-tab:focus-visible {
        outline: 2px solid #17494d;
        outline-offset: 2px;
      }

      .os-tab::before {
        display: inline-block;
        width: 1.5rem;
        height: 1.5rem;
        vertical-align: middle;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        content: "";
      }

      .os-tab--macos::before {
        background-image: url("../assets/macos-finder.png");
      }

      .os-tab--windows::before {
        background-image: url("../assets/windows-logo.png");
      }

      .os-tab--ios::before {
        background-image: url("../assets/ios-badge.png");
      }

      [role="tabpanel"] {
        min-height: 5rem;
        padding: 1.5rem 0;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Article tab preview</h1>
      <p>Click a tab to compare the OS icons. The icon-only tabs retain accessible names.</p>

      <div role="tablist" aria-label="Operating system">
        <button
          class="os-tab os-tab--macos"
          id="tab-macos"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-macos"
          tabindex="0"
        >macOS</button>
        <button
          class="os-tab os-tab--windows"
          id="tab-windows"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-windows"
          tabindex="-1"
        >Windows</button>
        <button
          class="os-tab os-tab--ios"
          id="tab-ios"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-ios"
          tabindex="-1"
        >iOS</button>
      </div>

      <section id="panel-macos" role="tabpanel" aria-labelledby="tab-macos">
        macOS tab content
      </section>
      <section
        id="panel-windows"
        role="tabpanel"
        aria-labelledby="tab-windows"
        hidden
      >
        Windows tab content
      </section>
      <section id="panel-ios" role="tabpanel" aria-labelledby="tab-ios" hidden>
        iOS tab content
      </section>
    </main>

    <script>
      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));

      function selectTab(selectedTab) {
        tabs.forEach((tab) => {
          const selected = tab === selectedTab;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          document
            .getElementById(tab.getAttribute("aria-controls"))
            .toggleAttribute("hidden", !selected);
        });
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectTab(tab));
        tab.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const step = event.key === "ArrowRight" ? 1 : -1;
          const nextTab = tabs[(index + step + tabs.length) % tabs.length];
          selectTab(nextTab);
          nextTab.focus();
        });
      });
    </script>
  </body>
</html>
